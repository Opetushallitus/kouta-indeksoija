name: 'Prepare clojure env'
description: 'Prepare clojure enviroment for build'
runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version-file: '.java-version'
        distribution: 'corretto'

    - name: Set timezone to Europe/Helsinki
      shell: bash
      run: |
        sudo timedatectl set-timezone Europe/Helsinki
        echo "Europe/Helsinki" | sudo tee /etc/timezone

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360 # 13.2
      with:
        lein: 2.11.2

    - name: Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-m2-